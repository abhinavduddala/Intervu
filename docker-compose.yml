version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: intervu-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: abhinav17
      POSTGRES_DB: intervu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: intervu-redis
    ports:
      - "6379:6379"

  backend:
    build: .
    container_name: intervu-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:abhinav17@postgres:5432/intervu
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=super_secret_change_me_in_production
      - JWT_EXPIRES_IN=7d
      - CLIENT_URL=http://localhost:5173
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.5-flash
    depends_on:
      - postgres
      - redis

  frontend:
    build: ./frontend
    container_name: intervu-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

volumes:
  pgdata:
